apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-web-deployment
  namespace: exam-web
  labels:
    app: mini-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-web
  template:
    metadata:
      annotations:
        checksum/config: "ca1bf9f158dbee1ce7f871133c491896ea5b86c7a258d4562da7f1b1369f4b18"
      labels:
        app: mini-web
    spec:
      containers:
        - name: mini-web
          image: nginx:1.31.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: web-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: web-config
          configMap:
            name: mini-web-config
