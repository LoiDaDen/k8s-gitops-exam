server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Pod-Name $hostname always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }
}
